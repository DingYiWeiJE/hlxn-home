services:
  app:
    build: .
    ports:
      - "80:3000"
    environment:
      DATABASE_URL: postgresql://hanly_app:HanLy.26@postgres:5432/hanly?schema=public
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm start"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=5", "http://localhost:3000/"]
      interval: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hanly_app
      POSTGRES_PASSWORD: HanLy.26
      POSTGRES_DB: hanly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanly_app"]
      interval: 5s
      retries: 5
